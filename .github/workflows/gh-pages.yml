name: Deploy to github pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Monthly Script Runner"]
    types:
      - completed

jobs:
  build-deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required so the deploy action can push
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build sites
        run: pnpm build
      - name: Stage ossheroes output
        run: |
          if [ ! -d apps/ossheroes/public ]; then
            echo "Error: apps/ossheroes/public directory not created"
            exit 1
          fi
          cp -r apps/ossheroes/public apps/www/dist/ossheroes
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: apps/www/dist
